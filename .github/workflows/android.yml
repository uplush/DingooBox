name: Android

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify bundled DingooEmu core
        run: |
          chmod +x scripts/verify-core.sh
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" ./scripts/verify-core.sh
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DingooBox-debug
          path: app/build/outputs/apk/debug/app-debug.apk
