name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.0.1

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          grep -F "versionName = \"$VERSION\"" app/build.gradle.kts

      - name: Install Rust Android toolchain
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"

      - name: Rebuild and verify DingooEmu core
        run: |
          chmod +x scripts/build-core.sh scripts/verify-core.sh
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" ./scripts/build-core.sh
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" ./scripts/verify-core.sh

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DINGOOBOX_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/DingooBox-release.jks"

      - name: Build signed release APK
        env:
          STORE_PASSWORD: ${{ secrets.DINGOOBOX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DINGOOBOX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DINGOOBOX_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-configuration-cache \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/DingooBox-release.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify and name release files
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          APK="DingooBox-${VERSION}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          APK="DingooBox-${VERSION}-arm64-v8a.apk"
          awk 'NR == 1 { next } /^# / { exit } { print }' RELEASE_NOTES.md > release-notes.md
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "DingooBox ${VERSION}" \
            --notes-file release-notes.md \
            --latest \
            "$APK" SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DingooBox-${{ inputs.tag }}-release
          path: |
            DingooBox-*.apk
            SHA256SUMS.txt
